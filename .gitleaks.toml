# JWS pada kartu contoh adalah tanda tangan publik, bukan token rahasia.
# Header-nya tetap: {"alg":"EdDSA","kid":"contoh-penerbit-1"}.
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "JWS EdDSA publik pada kartu contoh Jati"
regexTarget = "secret"
regexes = [
  '''eyJhbGciOiJFZERTQSIsImtpZCI6ImNvbnRvaC1wZW5lcmJpdC0xIn0\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+''',
]

[[rules]]
id = "jati-kunci-privat-ed25519"
description = "Komponen privat d pada JWK Ed25519"
regex = '''"d"\s*:\s*"[A-Za-z0-9_-]{40,}"'''
keywords = ["\"d\""]

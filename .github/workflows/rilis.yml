name: rilis

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag atau commit yang diterbitkan ke npm
        required: true
        default: v0.1.1

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: python3 -m venv .venv && .venv/bin/pip install -q cryptography
      - run: PYTHON=.venv/bin/python pnpm test
      - run: test -f packages/jati/dist/src/index.js && test -f packages/jati/dist/src/index.d.ts && test -f packages/jati/dist/cjs/index.cjs && test -f packages/jati/dist/bin/jati.js
      - id: token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN tidak ada. Paket tidak diterbitkan."
            exit 0
          fi
          echo "ada=true" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.token.outputs.ada == 'true'
        working-directory: packages/jati
        run: |
          npm pkg set \
            'repository.type=git' \
            'repository.url=https://github.com/adindamochamad/jati.git' \
            'repository.directory=packages/jati'
      - if: steps.token.outputs.ada == 'true'
        run: npm publish --provenance --access public
        working-directory: packages/jati
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
